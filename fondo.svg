<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gradFondo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo gradiente -->
  <rect width="1200" height="800" fill="url(#gradFondo)"/>
  
  <!-- Líneas decorativas suaves -->
  <path d="M 0 100 Q 300 50, 600 100 T 1200 100" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none"/>
  <path d="M 0 300 Q 300 250, 600 300 T 1200 300" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none"/>
  <path d="M 0 500 Q 300 450, 600 500 T 1200 500" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none"/>
  <path d="M 0 700 Q 300 650, 600 700 T 1200 700" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none"/>
  
  <!-- Círculos decorativos en las esquinas -->
  <circle cx="100" cy="80" r="60" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1100" cy="150" r="80" fill="rgba(255,255,255,0.08)"/>
  <circle cx="150" cy="700" r="70" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1050" cy="650" r="90" fill="rgba(255,255,255,0.07)"/>
  
  <!-- Iconos de paquetes/envíos -->
  <!-- Paquete 1 -->
  <g transform="translate(200, 150)" opacity="0.15">
    <rect x="0" y="0" width="60" height="60" fill="white" rx="4"/>
    <line x1="30" y1="0" x2="30" y2="60" stroke="white" stroke-width="2"/>
    <line x1="0" y1="30" x2="60" y2="30" stroke="white" stroke-width="2"/>
    <circle cx="15" cy="15" r="3" fill="white"/>
    <circle cx="45" cy="15" r="3" fill="white"/>
    <circle cx="15" cy="45" r="3" fill="white"/>
    <circle cx="45" cy="45" r="3" fill="white"/>
  </g>
  
  <!-- Paquete 2 -->
  <g transform="translate(950, 400)" opacity="0.12">
    <rect x="0" y="0" width="70" height="70" fill="white" rx="5"/>
    <line x1="35" y1="0" x2="35" y2="70" stroke="white" stroke-width="2"/>
    <line x1="0" y1="35" x2="70" y2="35" stroke="white" stroke-width="2"/>
    <circle cx="17.5" cy="17.5" r="4" fill="white"/>
    <circle cx="52.5" cy="17.5" r="4" fill="white"/>
    <circle cx="17.5" cy="52.5" r="4" fill="white"/>
    <circle cx="52.5" cy="52.5" r="4" fill="white"/>
  </g>
  
  <!-- Camión de envíos -->
  <g transform="translate(300, 500)" opacity="0.1">
    <!-- Cabina -->
    <rect x="0" y="15" width="30" height="25" fill="white" rx="2"/>
    <!-- Ventana -->
    <rect x="5" y="18" width="12" height="10" fill="#1e40af"/>
    <!-- Cuerpo -->
    <rect x="30" y="20" width="60" height="20" fill="white"/>
    <!-- Ruedas -->
    <circle cx="15" cy="42" r="6" fill="white"/>
    <circle cx="80" cy="42" r="6" fill="white"/>
    <!-- Detalles de ruedas -->
    <circle cx="15" cy="42" r="3" fill="#1e40af"/>
    <circle cx="80" cy="42" r="3" fill="#1e40af"/>
  </g>
  
  <!-- Símbolos de telefonos/contacto -->
  <g transform="translate(150, 400)" opacity="0.1">
    <circle cx="0" cy="0" r="15" fill="white"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#1e40af" stroke-width="2"/>
    <line x1="-8" y1="8" x2="8" y2="-8" stroke="#1e40af" stroke-width="2"/>
  </g>
  
  <g transform="translate(1050, 200)" opacity="0.12">
    <circle cx="0" cy="0" r="18" fill="white"/>
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#1e40af" stroke-width="2"/>
    <line x1="-9" y1="9" x2="9" y2="-9" stroke="#1e40af" stroke-width="2"/>
  </g>
  
  <!-- Puntos conectados (red de envíos) -->
  <g opacity="0.08">
    <circle cx="400" cy="200" r="4" fill="white"/>
    <circle cx="600" cy="300" r="4" fill="white"/>
    <circle cx="800" cy="250" r="4" fill="white"/>
    <line x1="400" y1="200" x2="600" y2="300" stroke="white" stroke-width="1"/>
    <line x1="600" y1="300" x2="800" y2="250" stroke="white" stroke-width="1"/>
  </g>
</svg>
